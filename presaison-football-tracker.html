* { font-family:'Inter',sans-serif; }
body { background:#0f1420; color:#f1f5f9; padding-bottom:80px; }
::-webkit-scrollbar { width:4px; }

/* ── Bottom Nav ── */
.bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:100; background:rgba(15,20,32,0.97); backdrop-filter:blur(12px); border-top:1px solid #1e2940; display:flex; height:64px; padding-bottom:env(safe-area-inset-bottom); }
.nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; border:none; background:transparent; color:#475569; transition:color 0.2s; padding:0; }
.nav-btn.active { color:#22c55e; }
.nav-btn svg { width:22px; height:22px; }
.nav-btn span { font-size:10px; font-weight:600; }
.nav-indicator { width:4px; height:4px; border-radius:50%; background:#22c55e; margin-top:1px; opacity:0; transition:opacity 0.2s; }
.nav-btn.active .nav-indicator { opacity:1; }

/* ── Section pages ── */
.page { display:none; }
.page.active { display:block; animation:fadeIn 0.25s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }

/* ── Presaison existing styles ── */
.ring-container { position:relative; display:inline-flex; align-items:center; justify-content:center; }
.ring-text { position:absolute; text-align:center; }
.exercise-card { transition:all 0.25s cubic-bezier(0.4,0,0.2,1); }
.exercise-card:hover { transform:translateY(-1px); }
.exercise-details { overflow:hidden; transition:max-height 0.4s cubic-bezier(0.4,0,0.2,1),opacity 0.25s ease; max-height:0; opacity:0; }
.exercise-details.open { max-height:800px; opacity:1; }
.day-tab { transition:all 0.2s ease; border-bottom:3px solid transparent; }
.day-tab.active { border-bottom-color:#22c55e; color:#22c55e; }
.week-btn { transition:all 0.2s ease; }
.week-btn.active { background:#22c55e; color:#fff; }
.week-btn:not(.active) { background:#1e2940; color:#64748b; }
.badge-force { background:#7c3aed22; color:#a78bfa; border:1px solid #7c3aed44; }
.badge-explosivite { background:#dc262622; color:#f87171; border:1px solid #dc262644; }
.badge-cardio { background:#0369a122; color:#38bdf8; border:1px solid #0369a144; }
.badge-football { background:#22c55e22; color:#4ade80; border:1px solid #22c55e44; }
.badge-repos { background:#64748b22; color:#94a3b8; border:1px solid #64748b44; }
.badge-epaules { background:#d9770722; color:#fb923c; border:1px solid #d9770744; }
.check-btn { transition:all 0.2s ease; }
.check-btn.checked { background:#22c55e; border-color:#22c55e; }
.check-btn svg { opacity:0; transition:opacity 0.15s; }
.check-btn.checked svg { opacity:1; }
@keyframes pulse-green { 0%,100%{box-shadow:0 0 0 0 #22c55e40;} 50%{box-shadow:0 0 0 12px transparent;} }
.timer-running { animation:pulse-green 1.5s infinite; }
.exercise-card.done { opacity:0.52; }
.exercise-card.done .exercise-title { text-decoration:line-through; color:#64748b; }
.chrono-digit { font-size:3rem; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-0.05em; font-family:'Courier New',monospace; }
.section-header { border-left:3px solid; padding-left:10px; }
.progress-bar { background:linear-gradient(90deg,#22c55e,#16a34a); transition:width 0.5s ease; border-radius:9999px; }
.day-content { animation:fadeIn 0.3s ease; }
.tabs-scroll { scrollbar-width:none; -ms-overflow-style:none; }
.tabs-scroll::-webkit-scrollbar { display:none; }
.s2-diff { background:#22c55e18; color:#4ade80; border:1px solid #22c55e30; font-size:10px; padding:1px 6px; border-radius:6px; white-space:nowrap; }
.yt-btn { display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border-radius:10px; background:#0a0e1a; border:1px solid #1e2940; cursor:pointer; transition:all 0.2s; text-decoration:none; }
.yt-btn:hover { background:#12192e; border-color:#22c55e44; }
.yt-icon { width:36px; height:36px; background:#ef4444; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.yt-text { text-align:left; }
.yt-text-title { font-size:12px; font-weight:600; color:#e2e8f0; }
.yt-text-sub { font-size:10px; color:#64748b; margin-top:1px; }

/* ── Protocoles ── */
.proto-tab { flex:1; padding:10px 4px; text-align:center; font-size:11px; font-weight:600; color:#475569; border-bottom:2px solid transparent; transition:all 0.2s; cursor:pointer; }
.proto-tab.active { color:#22c55e; border-bottom-color:#22c55e; }
.proto-step { display:flex; align-items:flex-start; gap:12px; padding:12px; border-radius:12px; background:#13192a; border:1px solid #1e2940; transition:all 0.2s; }
.proto-step.done { opacity:0.5; }
.proto-step.done .proto-text { text-decoration:line-through; color:#64748b; }
.proto-check { flex-shrink:0; width:24px; height:24px; border-radius:8px; border:2px solid #2d3748; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s; margin-top:1px; }
.proto-check.checked { background:#22c55e; border-color:#22c55e; }
.proto-check svg { opacity:0; transition:opacity 0.15s; }
.proto-check.checked svg { opacity:1; }
.proto-timer-btn { flex-shrink:0; padding:4px 8px; border-radius:8px; background:#1e2940; border:1px solid #2d3748; color:#64748b; font-size:11px; cursor:pointer; white-space:nowrap; margin-top:2px; }
.time-block-header { display:flex; align-items:center; gap:8px; margin:20px 0 10px; }
.time-block-line { flex:1; height:1px; background:#1e2940; }

/* ── Compléments ── */
.suppl-card { background:#13192a; border:1px solid #1e2940; border-radius:14px; overflow:hidden; margin-bottom:12px; }

.suppl-body { padding:0 14px 14px; display:flex; flex-direction:column; gap:8px; }
.suppl-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:#0d1525; border:1px solid #1a2236; }
.suppl-check { flex-shrink:0; width:22px; height:22px; border-radius:6px; border:2px solid #2d3748; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s; }
.suppl-check.checked { background:#22c55e; border-color:#22c55e; }

.notif-btn { display:flex; align-items:center; gap:8px; padding:12px 16px; border-radius:12px; border:1px dashed #22c55e44; background:#22c55e08; color:#4ade80; font-size:12px; font-weight:600; cursor:pointer; width:100%; text-align:left; transition:all 0.2s; }

let currentPage = 'presaison';

function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('nav-' + page).classList.add('active');
  currentPage = page;
  if (page === 'protocoles') renderProto();
  if (page === 'complements') renderSupplements();
}

// ============================================================
// PRÉ-SAISON STATE & RENDER
// ============================================================
let currentWeek=1,currentDay=0;
let completed=JSON.parse(localStorage.getItem('presaison_v3_completed')||'{}');
let openCards={};

function selectWeek(w){
  currentWeek=w;currentDay=0;
  ['1','2'].forEach(n=>{document.getElementById('week-btn-'+n).classList.toggle('active',n==w);});
  document.getElementById('header-subtitle').textContent=`Semaine ${w} · Programme complet`;
  renderTabs();renderDay();updateGlobalProgress();
}
function selectDay(id){currentDay=id;renderTabs();renderDay();updateGlobalProgress();}
function renderTabs(){
  const days=WEEKS[currentWeek-1];
  document.getElementById('day-tabs').innerHTML=days.map(d=>`
    <button onclick="selectDay(${d.id})" class="day-tab flex-shrink-0 px-3 py-3 text-xs font-semibold ${currentDay===d.id?'active':'text-slate-500'}">
      <div>${d.emoji}</div><div>${d.label}</div>
    </button>`).join('');
}
function renderDay(){
  const day=WEEKS[currentWeek-1][currentDay];
  const allEx=day.sections.flatMap(s=>s.exercises);
  const total=allEx.length,done=allEx.filter(e=>completed[e.id]).length;
  const pct=total>0?Math.round((done/total)*100):0;
  const circ=2*Math.PI*22;
  let html=`<div class="day-content">
    <div class="flex items-start justify-between mb-6">
      <div>
        <div class="flex items-center gap-2 mb-1 flex-wrap">
          <span class="text-2xl">${day.emoji}</span>
          <h1 class="text-xl font-bold text-white">${day.full}</h1>
          <span class="text-xs font-semibold px-2.5 py-1 rounded-full badge-${day.badge}">${day.badgeLabel}</span>
          <span class="text-xs font-semibold px-2 py-0.5 rounded-lg" style="background:#22c55e20;color:#4ade80;border:1px solid #22c55e30;">S${currentWeek}</span>
        </div>
        <p class="text-sm" style="color:#94a3b8;">${day.theme}</p>
      </div>
      <div class="ring-container flex-shrink-0" style="width:56px;height:56px;">
        <svg width="56" height="56" viewBox="0 0 56 56" class="-rotate-90">
          <circle cx="28" cy="28" r="22" fill="none" stroke="#1e2940" stroke-width="5"/>
          <circle cx="28" cy="28" r="22" fill="none" stroke="#22c55e" stroke-width="5"
            stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct/100)}" stroke-linecap="round" style="transition:stroke-dashoffset 0.6s ease;"/>
        </svg>
        <div class="ring-text text-center">
          <div class="text-xs font-bold text-white leading-none">${pct}%</div>
          <div style="font-size:9px;color:#64748b;">${done}/${total}</div>
        </div>
      </div>
    </div>

function toggleCard(id){

function toggleDone(id){completed[id]=!completed[id];localStorage.setItem('presaison_v3_completed',JSON.stringify(completed));renderDay();updateGlobalProgress();}
function updateGlobalProgress(){
  const days=WEEKS[currentWeek-1];
  const allEx=days.flatMap(d=>d.sections.flatMap(s=>s.exercises));
  const total=allEx.length,done=allEx.filter(e=>completed[e.id]).length;
  const pct=total>0?Math.round((done/total)*100):0;
  const daysDone=days.filter(d=>d.sections.flatMap(s=>s.exercises).some(e=>completed[e.id])).length;
  const t=document.getElementById('global-progress-text');
  const p=document.getElementById('global-pct');
  const r=document.getElementById('global-ring');
  if(t)t.textContent=`${daysDone} / 7`;
  if(p)p.textContent=`${pct}%`;
  if(r)r.style.strokeDashoffset=113*(1-pct/100);
}
function parseRest(s){
  if(!s||s==='—')return 0;
  if(s.includes('2min30')||s.includes('2m30'))return 150;
  if(s.includes('3min'))return 180;
  if(s.includes('2min'))return 120;
  if(s.includes('90s'))return 90;
  if(s.includes('75s'))return 75;
  if(s.includes('60s'))return 60;
  if(s.includes('45s'))return 45;
  if(s.includes('30s'))return 30;
  if(s.includes('20s'))return 20;
  if(s.includes('15s'))return 15;
  return 0;
}

async function requestNotifications(){
  if(!('Notification' in window)){
    alert('Les notifications ne sont pas supportées sur ce navigateur.');
    return;
  }
  const perm=await Notification.requestPermission();
  if(perm==='granted'){
    scheduleNotifications();
    alert('✅ Rappels activés ! Tu recevras des notifications aux heures de prise de chaque complément.');
  } else {
    alert('❌ Permission refusée. Active les notifications dans les réglages de ton navigateur pour ce site.');
  }
}

function scheduleNotifications(){
  if(!('serviceWorker' in navigator))return;
  // Les notifications push périodiques nécessitent un SW — on utilise ici
  // des notifications différées via setTimeout pour la session en cours
  const now=new Date();
  NOTIF_SCHEDULE.forEach(n=>{
    const target=new Date();
    target.setHours(n.hour,n.min,0,0);
    const delay=target-now;
    if(delay>0){
      setTimeout(()=>{
        if(Notification.permission==='granted'){
          new Notification(n.title,{body:n.body,icon:'icon-192.png',badge:'icon-192.png'});
        }
      },delay);
    }
  });
}

function openTimer(sec,label){
  clearInterval(timerInterval);
  timerTotal=sec||90;timerRemaining=timerTotal;timerRunning=true;
  document.getElementById('timer-label').textContent=label||'Récupération';
  updateTimerDisplay();
  document.getElementById('timer-modal').style.display='flex';
  const btn=document.getElementById('timer-toggle-btn');
  btn.textContent='⏸ Pause';btn.classList.add('timer-running');
  startCount();
}
function startCount(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(timerRemaining>0){timerRemaining--;updateTimerDisplay();}
    else{
      clearInterval(timerInterval);timerRunning=false;
      const btn=document.getElementById('timer-toggle-btn');
      btn.textContent='✓ Terminé';btn.classList.remove('timer-running');
      playBeep();
    }
  },1000);
}
function toggleTimer(){
  const btn=document.getElementById('timer-toggle-btn');
  if(timerRunning){clearInterval(timerInterval);timerRunning=false;btn.textContent='▶ Reprendre';btn.classList.remove('timer-running');}
  else{timerRunning=true;btn.textContent='⏸ Pause';btn.classList.add('timer-running');startCount();}
}
function resetTimer(){
  clearInterval(timerInterval);timerRemaining=timerTotal;timerRunning=false;
  updateTimerDisplay();
  const btn=document.getElementById('timer-toggle-btn');
  btn.textContent='▶ Start';btn.classList.remove('timer-running');
}
function setTimer(sec,label){
  clearInterval(timerInterval);timerTotal=sec;timerRemaining=sec;timerRunning=true;
  if(label)document.getElementById('timer-label').textContent=label;
  updateTimerDisplay();
  const btn=document.getElementById('timer-toggle-btn');
  btn.textContent='⏸ Pause';btn.classList.add('timer-running');
  startCount();
}
function closeTimer(){
  clearInterval(timerInterval);timerRunning=false;
  document.getElementById('timer-modal').style.display='none';
}
function updateTimerDisplay(){
  const m=Math.floor(timerRemaining/60),s=timerRemaining%60;
  document.getElementById('timer-display').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  const pct=timerTotal>0?(timerRemaining/timerTotal)*100:0;
  const color=timerRemaining<=10?'#ef4444':timerRemaining<=20?'#f59e0b':'#22c55e';
  const bar=document.getElementById('timer-progress');
  bar.style.width=pct+'%';bar.style.background=color;
}
function playBeep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,220,440].forEach(delay=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=880;
      g.gain.setValueAtTime(0.3,ctx.currentTime+delay/1000);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+delay/1000+0.15);
      o.start(ctx.currentTime+delay/1000);o.stop(ctx.currentTime+delay/1000+0.15);
    });
  }catch(e){}
}
document.getElementById('timer-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeTimer();});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&document.getElementById('timer-modal').style.display==='flex'){e.preventDefault();toggleTimer();}
  if(e.code==='Escape')closeTimer();
});

renderTabs();renderDay();updateGlobalProgress();

  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
