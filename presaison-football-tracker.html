  .badge-epaules  { background:#d9770722; color:#fb923c; border:1px solid #d9770744; }

  .check-btn svg { opacity:0; transition:opacity 0.15s; }
  .check-btn.checked svg { opacity:1; }

  .timer-running { animation: pulse-green 1.5s infinite; }
  .exercise-card.done { opacity:0.52; }
  .exercise-card.done .exercise-title { text-decoration:line-through; color:#64748b; }

</div>

let currentWeek = 1;
let currentDay  = 0;

// ============================================================
// RENDER
// ============================================================
function selectWeek(w) {
  currentWeek = w; currentDay = 0;
  ['1','2'].forEach(n => {
    document.getElementById('week-btn-'+n).classList.toggle('active', n==w);
  });
  document.getElementById('header-subtitle').textContent = `Semaine ${w} · Programme complet`;
  renderTabs(); renderDay(); updateGlobalProgress();
}

function selectDay(id) {
  currentDay = id;
  renderTabs(); renderDay(); updateGlobalProgress();
}

function renderTabs() {
  const days = WEEKS[currentWeek-1];
  document.getElementById('day-tabs').innerHTML = days.map(d => `
    <button onclick="selectDay(${d.id})"
      class="day-tab flex-shrink-0 px-3 py-3 text-xs font-semibold ${currentDay===d.id?'active':'text-slate-500'}">
      <div>${d.emoji}</div><div>${d.label}</div>
    </button>`).join('');
}

function renderDay() {
  const day = WEEKS[currentWeek-1][currentDay];
  const allEx = day.sections.flatMap(s => s.exercises);
  const total = allEx.length;
  const done  = allEx.filter(e => completed[e.id]).length;
  const pct   = total > 0 ? Math.round((done/total)*100) : 0;
  const circ  = 2 * Math.PI * 22;

  let html = `<div class="day-content">
    <div class="flex items-start justify-between mb-6">
      <div>
        <div class="flex items-center gap-2 mb-1 flex-wrap">
          <span class="text-2xl">${day.emoji}</span>
          <h1 class="text-xl font-bold text-white">${day.full}</h1>
          <span class="text-xs font-semibold px-2.5 py-1 rounded-full badge-${day.badge}">${day.badgeLabel}</span>
          <span class="text-xs font-semibold px-2 py-0.5 rounded-lg" style="background:#22c55e20;color:#4ade80;border:1px solid #22c55e30;">S${currentWeek}</span>
        </div>
        <p class="text-sm" style="color:#94a3b8;">${day.theme}</p>
      </div>
      <div class="ring-container flex-shrink-0" style="width:56px;height:56px;">
        <svg width="56" height="56" viewBox="0 0 56 56" class="-rotate-90">
          <circle cx="28" cy="28" r="22" fill="none" stroke="#1e2940" stroke-width="5"/>
          <circle cx="28" cy="28" r="22" fill="none" stroke="#22c55e" stroke-width="5"
            stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct/100)}"
            stroke-linecap="round" style="transition:stroke-dashoffset 0.6s ease;"/>
        </svg>
        <div class="ring-text text-center">
          <div class="text-xs font-bold text-white leading-none">${pct}%</div>
          <div style="font-size:9px;color:#64748b;">${done}/${total}</div>
        </div>
      </div>
    </div>
    <div class="rounded-full h-1.5 mb-6" style="background:#1e2940;">
      <div class="h-1.5 rounded-full progress-bar" style="width:${pct}%;"></div>
    </div>
    <button onclick="openTimer(90,'Récupération — 90s')"
      class="mb-6 w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-semibold"
      style="background:#1e2940;border:1px solid #2d3748;color:#94a3b8;">
      <span>⏱</span> Chronomètre récupération
    </button>`;

  day.sections.forEach(section => {
    const secDone = section.exercises.filter(e => completed[e.id]).length;
    html += `
      <div class="mb-5">
        <div class="flex items-center justify-between mb-3">
          <div class="section-header" style="border-left-color:${section.color};">
            <span class="text-sm font-semibold" style="color:${section.color};">${section.title}</span>
          </div>
          <span class="text-xs" style="color:#475569;">${secDone}/${section.exercises.length}</span>
        </div>
        <div class="flex flex-col gap-2">`;
    section.exercises.forEach(ex => {
      html += renderCard(ex, !!completed[ex.id]);
    });
    html += `</div></div>`;
  });
  html += `</div>`;
  document.getElementById('main-content').innerHTML = html;
}

          <div class="flex gap-2 mb-2 flex-wrap">
            <span class="text-xs px-2 py-1 rounded-lg font-mono" style="background:#1e2940;color:#22c55e;">${ex.sets} séries</span>
            <span class="text-xs px-2 py-1 rounded-lg font-mono" style="background:#1e2940;color:#38bdf8;">${ex.reps}</span>
            ${ex.rest!=='—'?`<span class="text-xs px-2 py-1 rounded-lg font-mono" style="background:#1e2940;color:#f59e0b;">↺ ${ex.rest}</span>`:''}
          </div>
          ${videoBlock}
        </div>
      </div>
    </div>`;
}

// ============================================================
// INTERACTIONS
// ============================================================
function toggleCard(id) {
  openCards[id] = !openCards[id];
  const details = document.getElementById(`details-${id}`);
  if (details) details.classList.toggle('open', !!openCards[id]);
  // Rotate chevron
  const card = document.getElementById(`card-${id}`);
  if (card) {
    const svg = card.querySelector('.flex.items-center.gap-2.flex-shrink-0 svg');
    if (svg) svg.style.transform = openCards[id] ? 'rotate(180deg)' : 'rotate(0deg)';
  }
}



function toggleDone(id) {
  completed[id] = !completed[id];
  localStorage.setItem('presaison_v3_completed', JSON.stringify(completed));
  renderDay(); updateGlobalProgress();
}

function updateGlobalProgress() {
  const days = WEEKS[currentWeek-1];
  const allEx = days.flatMap(d => d.sections.flatMap(s => s.exercises));
  const total = allEx.length;
  const done  = allEx.filter(e => completed[e.id]).length;
  const pct   = total > 0 ? Math.round((done/total)*100) : 0;
  const daysDone = days.filter(d => d.sections.flatMap(s=>s.exercises).some(e=>completed[e.id])).length;
  const t=document.getElementById('global-progress-text');
  const p=document.getElementById('global-pct');
  const r=document.getElementById('global-ring');
  if(t) t.textContent=`${daysDone} / 7`;
  if(p) p.textContent=`${pct}%`;
  if(r) r.style.strokeDashoffset=113*(1-pct/100);
}

function parseRest(s) {
  if(!s||s==='—') return 0;
  if(s.includes('2min30')||s.includes('2m30')) return 150;
  if(s.includes('3min')) return 180;
  if(s.includes('2min')) return 120;
  if(s.includes('90s'))  return 90;
  if(s.includes('75s'))  return 75;
  if(s.includes('60s'))  return 60;
  if(s.includes('45s'))  return 45;
  if(s.includes('30s'))  return 30;
  if(s.includes('20s'))  return 20;
  if(s.includes('15s'))  return 15;
  return 0;
}

// ============================================================
// TIMER
// ============================================================
function openTimer(sec, label) {
  clearInterval(timerInterval);
  timerTotal=sec||90; timerRemaining=timerTotal; timerRunning=true;
  document.getElementById('timer-label').textContent=label||'Récupération';
  updateTimerDisplay();
  document.getElementById('timer-modal').style.display='flex';
  const btn=document.getElementById('timer-toggle-btn');
  btn.textContent='⏸ Pause'; btn.classList.add('timer-running');
  startCount();
}
function startCount() {
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(timerRemaining>0){timerRemaining--;updateTimerDisplay();}
    else{
      clearInterval(timerInterval);timerRunning=false;
      const btn=document.getElementById('timer-toggle-btn');
      btn.textContent='✓ Terminé';btn.classList.remove('timer-running');
      playBeep();
    }
  },1000);
}
function toggleTimer() {
  const btn=document.getElementById('timer-toggle-btn');
  if(timerRunning){clearInterval(timerInterval);timerRunning=false;btn.textContent='▶ Reprendre';btn.classList.remove('timer-running');}
  else{timerRunning=true;btn.textContent='⏸ Pause';btn.classList.add('timer-running');startCount();}
}
function resetTimer() {
  clearInterval(timerInterval);timerRemaining=timerTotal;timerRunning=false;
  updateTimerDisplay();
  const btn=document.getElementById('timer-toggle-btn');
  btn.textContent='▶ Start';btn.classList.remove('timer-running');
}
function setTimer(sec,label) {
  clearInterval(timerInterval);timerTotal=sec;timerRemaining=sec;timerRunning=true;
  if(label) document.getElementById('timer-label').textContent=label;
  updateTimerDisplay();
  const btn=document.getElementById('timer-toggle-btn');
  btn.textContent='⏸ Pause';btn.classList.add('timer-running');
  startCount();
}
function closeTimer() {
  clearInterval(timerInterval);timerRunning=false;
  document.getElementById('timer-modal').style.display='none';
}
function updateTimerDisplay() {
  const m=Math.floor(timerRemaining/60),s=timerRemaining%60;
  document.getElementById('timer-display').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  const pct=timerTotal>0?(timerRemaining/timerTotal)*100:0;
  const color=timerRemaining<=10?'#ef4444':timerRemaining<=20?'#f59e0b':'#22c55e';
  const bar=document.getElementById('timer-progress');
  bar.style.width=pct+'%'; bar.style.background=color;
}
function playBeep() {
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,220,440].forEach(delay=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=880;
      g.gain.setValueAtTime(0.3,ctx.currentTime+delay/1000);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+delay/1000+0.15);
      o.start(ctx.currentTime+delay/1000);o.stop(ctx.currentTime+delay/1000+0.15);
    });
  }catch(e){}
}
document.getElementById('timer-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeTimer();});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&document.getElementById('timer-modal').style.display==='flex'){e.preventDefault();toggleTimer();}
  if(e.code==='Escape')closeTimer();
});

// ============================================================
// INIT
// ============================================================
renderTabs(); renderDay(); updateGlobalProgress();

// PWA — Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('✅ SW enregistré'))
      .catch(err => console.log('SW erreur:', err));
  });
}
</script>
